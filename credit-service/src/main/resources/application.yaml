server:
  port: 7200

spring:
  application:
    name: credit-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/credit}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

spring.cloud.aws:
  region:
    static: us-east-1
  credentials:
    access-key: ${AWS_ACCESS_KEY:test}
    secret-key: ${AWS_SECRET_KEY:test}
  sns:
    endpoint: http://localhost:4566
  sqs:
    endpoint: http://localhost:4566

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  security:
    api-key: ${API_KEY}
  notification:
    topic-arn: arn:aws:sns:us-east-1:000000000000:credit-transactions
  reconciliation:
    cron: "0 */5 * * * *"
    pending-timeout-minutes: 10
  cache:
    balance-ttl-minutes: 30
