server:
  port: 7200

spring:
  application:
    name: credit-service
  datasource:
    url: jdbc:postgresql://localhost:5432/credit
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

spring.cloud.aws:
  region:
    static: us-east-1
  credentials:
    access-key: test
    secret-key: test
  sns:
    endpoint: http://localhost:4566
  sqs:
    endpoint: http://localhost:4566

app:
  notification:
    topic-arn: arn:aws:sns:us-east-1:000000000000:credit-transactions
  reconciliation:
    cron: "0 */5 * * * *"
    pending-timeout-minutes: 10
  cache:
    balance-ttl-minutes: 30
