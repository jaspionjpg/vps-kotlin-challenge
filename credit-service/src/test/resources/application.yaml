server:
  port: 0

spring:
  application:
    name: credit-service-test
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

spring.cloud.aws:
  region:
    static: us-east-1
  credentials:
    access-key: test
    secret-key: test
  sns:
    endpoint: http://localhost:4566
  sqs:
    endpoint: http://localhost:4566

app:
  notification:
    topic-arn: arn:aws:sns:us-east-1:000000000000:credit-transactions
  reconciliation:
    cron: "-"
    pending-timeout-minutes: 10
  cache:
    balance-ttl-minutes: 30
